<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 01 · Маршрут</title><style>body{background:#07101f;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;line-height:1.6}main{max-width:1080px;margin:auto;padding:25px 20px 65px}a{color:#4ce3ff}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.1}h1,h2{color:#eff9ff}h2{color:#4ce3ff}.panel,.card{background:#101f35;border:1px solid #284768;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.btn,button{display:inline-block;background:#123c60;border:1px solid #35c8ee;color:white;padding:11px 16px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;margin:5px 5px 5px 0}button:hover,.btn:hover{background:#17658b}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{background:#071524;border:1px solid #4d7595;border-radius:8px;color:white;padding:10px;font:inherit;max-width:100%}.muted,small{color:#a8bdd4}.ok{color:#6cf0a8}.bad{color:#ff8796}.pill{display:inline-block;border:1px solid #3d718b;padding:5px 10px;border-radius:20px;margin:3px}.tile{background:#142d47;border:1px solid #487aa0;border-radius:10px;padding:12px;cursor:grab;touch-action:none}.drop{min-height:65px;border:2px dashed #45789c;border-radius:12px;padding:12px}.drop.over{background:#214c68}pre{white-space:pre-wrap;word-break:break-word;background:#061321;padding:16px;border-radius:12px;border:1px solid #254661}nav{padding:12px 0}.tag{color:#4ce3ff;letter-spacing:.15em;font-weight:700}</style></head><body><main><nav><a href="mission-09.html">← Місія 09</a> · <a href="../">CyberLab</a></nav><div class="tag">ПРАКТИКА 01 / МЕРЕЖЕВИЙ МАРШРУТ</div><h1>🧭 Віднови шлях запиту</h1><p>Розмістіть картки в порядку подій. Можна перетягувати мишкою або натискати на картку, а потім на комірку — працює й на телефоні.</p><div class="panel"><div id="pool" class="grid"></div><h2>Маршрут</h2><div id="slots" class="grid"></div><button id="check">Перевірити</button><button id="reset">Почати знову</button><p id="feedback" aria-live="polite"></p></div></main><script>const correct=['Ввели домен', 'DNS повернув IP', 'Встановили з’єднання', 'TLS для HTTPS', 'HTTP-запит', 'HTTP-відповідь'];let chosen=Array(6).fill(null),selected=null;const pool=document.getElementById('pool'),slots=document.getElementById('slots');function draw(){pool.innerHTML='';correct.forEach((s,i)=>{if(chosen.includes(i))return;let el=document.createElement('button');el.className='tile';el.textContent=s;el.draggable=true;el.onclick=()=>{selected=i;document.getElementById('feedback').textContent='Обрано: '+s+' — натисніть потрібну комірку.'};el.ondragstart=e=>e.dataTransfer.setData('text/plain',i);pool.append(el)});slots.innerHTML='';chosen.forEach((v,n)=>{let el=document.createElement('div');el.className='drop';el.textContent=(n+1)+'. '+(v===null?'Перетягніть або натисніть':' '+correct[v]);el.onclick=()=>{if(selected!==null){chosen=chosen.map(x=>x===selected?null:x);chosen[n]=selected;selected=null}else chosen[n]=null;draw()};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let i=Number(e.dataTransfer.getData('text/plain'));chosen=chosen.map(x=>x===i?null:x);chosen[n]=i;draw()};slots.append(el)})}document.getElementById('check').onclick=()=>{let ok=chosen.every((x,i)=>x===i);let f=document.getElementById('feedback');f.textContent=ok?'✅ NETWORK PATH RESTORED. Відмінно!':'⚠️ Порядок поки неправильний. Подумайте, коли браузер дізнається IP та коли надсилає HTTP-запит.';f.className=ok?'ok':'bad'};document.getElementById('reset').onclick=()=>{chosen=Array(6).fill(null);selected=null;draw();document.getElementById('feedback').textContent=''};correct.sort(()=>Math.random()-.5);const actual=['Ввели домен','DNS повернув IP','Встановили з’єднання','TLS для HTTPS','HTTP-запит','HTTP-відповідь'];document.getElementById('check').onclick=()=>{let ok=chosen.every((x,i)=>x!==null&&correct[x]===actual[i]);let f=document.getElementById('feedback');f.textContent=ok?'✅ NETWORK PATH RESTORED. Відмінно!':'⚠️ Перевірте порядок: DNS перед з’єднанням, TLS перед захищеним HTTP-запитом.';f.className=ok?'ok':'bad'};draw();</script></body></html>
