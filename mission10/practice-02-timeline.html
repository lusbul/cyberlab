<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 02 · Хронологія</title><style>body{background:#07101f;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;line-height:1.6}main{max-width:1080px;margin:auto;padding:25px 20px 65px}a{color:#4ce3ff}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}h2{color:#4ce3ff}.panel,.card{background:#101f35;border:1px solid #284768;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn,button{display:inline-block;background:#123c60;border:1px solid #35c8ee;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;margin:5px 4px 5px 0}button:hover,.btn:hover{background:#17658b}input,select,textarea{background:#071524;border:1px solid #4d7595;border-radius:8px;color:white;padding:10px;font:inherit;max-width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061321;padding:14px;border-radius:12px;border:1px solid #254661}.tag{color:#4ce3ff;letter-spacing:.12em;font-weight:700}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:2rem;align-items:center;padding:36px 0}.hero img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:1px solid #2c5372}.muted{color:#abc3d9}.ok{color:#74f0b2}.bad{color:#ff8494}.tile{border:1px solid #487aa0;background:#17354f;border-radius:10px;padding:10px;cursor:grab;margin:6px 0}.drop{min-height:45px;border:2px dashed #487aa0;border-radius:10px;padding:10px;margin:6px 0}.drop.over{background:#234a66}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #34506a;text-align:left}tr[data-i]{cursor:pointer}tr[data-i]:hover,tr.selected{background:#254869}.scroll{overflow:auto;max-height:390px}code{color:#8de9ff}@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{max-width:360px}}</style></head><body><main><nav><a href="mission-10.html">← Місія 10</a> · <a href="../">CyberLab</a></nav><h1>🧩 Відновіть хронологію</h1><p>Перетягніть події в правильному порядку. На телефоні можна натискати картку, потім місце призначення.</p><section class="panel"><h2>Картки</h2><div id="bank" class="grid"></div><h2>Хронологія</h2><div id="slots"></div><button onclick="check()">Перевірити</button><button onclick="start()">Почати знову</button><p id="result" aria-live="polite"></p></section></main><script>const steps=["DNS-запит", "DNS-відповідь з IP", "TCP-з’єднання", "HTTP GET", "HTTP RESPONSE", "HTTP POST"];let order=[];let picked=null;function start(){order=Array(6).fill(null);picked=null;render()}function render(){let b=document.getElementById('bank');b.innerHTML='';steps.forEach((s,i)=>{if(order.includes(i))return;let d=document.createElement('button');d.className='tile';d.textContent=s;d.draggable=true;d.ondragstart=e=>e.dataTransfer.setData('text/plain',i);d.onclick=()=>{picked=i;document.getElementById('result').textContent='Картку обрано. Натисніть потрібний рядок.'};b.appendChild(d)});let slots=document.getElementById('slots');slots.innerHTML='';order.forEach((v,i)=>{let d=document.createElement('div');d.className='drop';d.textContent=(i+1)+'. '+(v===null?'Перетягніть картку сюди':steps[v]+' (натисніть, щоб повернути)');d.ondragover=e=>e.preventDefault();d.ondrop=e=>{e.preventDefault();put(i,+e.dataTransfer.getData('text/plain'))};d.onclick=()=>{if(picked!==null)put(i,picked);else if(v!==null){order[i]=null;render()}};slots.appendChild(d)})}function put(i,v){if(!Number.isInteger(v)||v<0||v>5)return;order=order.map(x=>x===v?null:x);order[i]=v;picked=null;render()}function check(){document.getElementById('result').textContent=order.every((x,i)=>x===i)?'✓ Хронологію відновлено! Чудово. Фінальний FLAG отримують у вебботі.':'Ще не зовсім. Спочатку комп’ютер шукає IP, а після з’єднання відправляє запит.'}start();</script></body></html>
