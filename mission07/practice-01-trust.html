<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101f"><title>CyberLab · Місія 07</title><style>

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition-duration: .01ms !important; } }

.game{background:#0d1a2d;border:1px solid #1c3554;border-radius:18px;padding:20px;margin:18px 0}.game h2{margin-top:0}.game button,.game select,.game input:not([type=file]),.game textarea{font:inherit}.game button{background:#073b55;color:white;border:1px solid #00d9ff;border-radius:10px;padding:10px 15px;cursor:pointer;margin:5px}.game button:hover{background:#005e7d}.game input:not([type=file]),.game textarea,.game select{color:#eaf8ff;background:#07101f;border:1px solid #2b5677;padding:10px;border-radius:8px;max-width:100%}.game .ok{color:#68f0a0}.game .bad{color:#ffd05a}.game .hash{word-break:break-all;font-family:monospace;color:#7de8ff}.game .tiles{display:flex;flex-wrap:wrap;gap:10px}.game .tile{padding:12px;border:1px solid #00d9ff;border-radius:10px;background:#102c48;cursor:grab}.game .drop{padding:15px;border:1px dashed #62dfff;border-radius:10px;min-height:68px;margin:10px 0}.game .drop.over{background:#174a62}.game .muted{color:#9fb2ca}.game .step{color:#00d9ff;font-size:.85rem;letter-spacing:.12em}.game .hidden{display:none!important}.game .btn{display:inline-block;background:#073b55;border:1px solid #00d9ff;border-radius:10px;padding:9px 13px;text-decoration:none}.game label{display:block;margin:10px 0}.game .status{padding:10px;border-left:3px solid #00d9ff;margin:12px 0}.game pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#07101f;padding:14px;border-radius:10px}

input,textarea,select{background:#09172a;color:#eef6ff;border:1px solid #345577;border-radius:10px;padding:12px;font:inherit;max-width:100%;width:100%}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.mini{font-size:.86rem;color:#a9bed5}.feedback{margin-top:12px;min-height:24px;color:#68f0a0}.chip{display:inline-block;border:1px solid #2c5c7e;border-radius:12px;padding:10px;margin:5px;background:#0c2340}.good{color:#68f0a0}.bad{color:#ff8585}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#071222;padding:15px;border:1px solid #274263;border-radius:12px}.stack{display:grid;gap:14px}.btn{display:inline-block;background:#093452;border:1px solid #13c6ed;color:#eef6ff;padding:11px 16px;border-radius:11px;font:inherit;cursor:pointer}.btn:hover{background:#125477}.btn.primary{background:#008caf}.layout{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.box7{background:#0d1a2d;border:1px solid #24435f;padding:18px;border-radius:16px}.box7 h3{margin-top:0}.drag{cursor:grab;touch-action:manipulation}.target{min-height:88px;border:1px dashed #38b7d6;border-radius:12px;padding:12px;margin-top:10px}.target:focus{outline:2px solid cyan}details summary{cursor:pointer} .report-only{display:none}@media print{header,.no-print,button,.btn,form{display:none!important}.report-only{display:block}body{background:#fff;color:#000}.box7{background:white;color:black;border:1px solid #aaa}.feedback{color:black}}
</style></head><body><header class="topbar"><nav class="nav wrap"><a class="brand" href="../index.html"><span class="brand-mark">⌘</span><span>CYBERLAB<small>КІБЕРБЕЗПЕКА</small></span></a><div class="nav-links"><a href="../index.html#missions">Усі місії</a></div></nav></header><main class="wrap" style="padding:40px 0 70px"><div class="eyebrow">ПРАКТИКА 01 · DRAG & DROP</div><h1>Кому довіряти?</h1><p class="lead">Перетягніть докази в правильну категорію. На смартфоні можна натиснути на картку, а потім на категорію.</p><div class="box7"><h3>Докази</h3><div id="pool"></div></div><div class="layout" id="zones"></div><p><button class="btn primary" onclick="check()">Перевірити рішення</button> <button class="btn" onclick="location.reload()">Почати знову</button></p><div id="result" class="feedback"></div><p class="mini">Навчальна практика. Ключ місії та PDF видає тільки веббот.</p><script>
const cards=[['Логотип CyberLab на PDF',0],['Картинка рукописного підпису',0],['SIGNATURE VALID з невідомим ключем',1],['Публічний ключ має напис Official',1],['Підпис VALID + відбиток ключа збігається з довіреним',2],['Підпис INVALID',1]];const labels=['Зовнішні ознаки — не доказ','Потрібна перевірка / недовіра','Перевірений підпис і ключ'];let assigned={},chosen=null;const pool=document.getElementById('pool');cards.forEach((c,i)=>{let e=document.createElement('button');e.className='chip drag';e.draggable=true;e.textContent=c[0];e.id='c'+i;e.onclick=()=>{chosen=i;document.querySelectorAll('.drag').forEach(x=>x.style.outline='');e.style.outline='2px solid cyan'};e.ondragstart=ev=>ev.dataTransfer.setData('text/plain',i);pool.append(e)});labels.forEach((l,i)=>{let b=document.createElement('div');b.className='box7';b.innerHTML='<h3>'+l+'</h3><div class="target" tabindex="0" role="button" aria-label="Перемістити сюди" id="z'+i+'"></div>';document.getElementById('zones').append(b);let t=b.querySelector('.target');t.ondragover=e=>e.preventDefault();t.ondrop=e=>{e.preventDefault();move(Number(e.dataTransfer.getData('text/plain')),i)};t.onclick=()=>{if(chosen!==null)move(chosen,i)};t.onkeydown=e=>{if(e.key==='Enter'&&chosen!==null)move(chosen,i)}});function move(c,z){if(!Number.isInteger(c)||!cards[c])return;assigned[c]=z;document.getElementById('z'+z).append(document.getElementById('c'+c));chosen=null}function check(){let n=cards.filter((c,i)=>assigned[i]===c[1]).length;document.getElementById('result').textContent=n===cards.length?'Чудово! Ви відрізняєте зовнішні ознаки від криптографічного доказу.':`Правильно ${n} із ${cards.length}. Перегляньте класифікацію ще раз.`}
</script></main><footer class="footer"><div class="wrap footer-row"><span>CYBERLAB · CASE 007</span><a href="../index.html#missions">Усі місії ↗</a></div></footer></body></html>
