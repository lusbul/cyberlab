<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CYBERLAB · Діалог CASE 004</title><style>
:root{--bg:#081321;--panel:#10263a;--line:#31506b;--text:#e9f6ff;--muted:#aac2d2;--aqua:#62e7e5;--green:#85edba}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0,#17445b,transparent 42%),var(--bg);color:var(--text);font:16px/1.5 system-ui,"Segoe UI",sans-serif}.wrap{width:min(760px,calc(100% - 24px));margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}.brand{font-weight:900;letter-spacing:.09em;color:var(--aqua)}a{color:var(--aqua)}.head{background:#10263acc;border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:12px}.head h1{margin:4px 0;font-size:clamp(25px,5vw,38px)}.head p{color:var(--muted);margin:5px 0}.bar{height:8px;background:#253b4d;border-radius:12px;overflow:hidden;margin-top:14px}.fill{height:100%;background:linear-gradient(90deg,#48b9d9,#85edba);width:0;transition:width .3s}.chat{border:1px solid var(--line);border-radius:20px;background:#0d1d2b;min-height:340px;padding:17px;display:flex;flex-direction:column;gap:12px}.bubble{max-width:92%;padding:13px 15px;border-radius:15px;white-space:pre-line;overflow-wrap:anywhere}.bot{background:#1b354b;align-self:flex-start;border-bottom-left-radius:4px}.me{background:#184f59;align-self:flex-end;border-bottom-right-radius:4px}.tag{font-size:11px;font-weight:800;letter-spacing:.08em;color:#9de8e4;margin-bottom:5px}.choices{display:grid;gap:9px;margin:12px 0 18px}.choices button,.restart,.link{border:1px solid #39798c;border-radius:12px;background:#143447;color:#e8ffff;padding:12px 14px;font:inherit;text-align:left;cursor:pointer}.choices button:hover{background:#205266}.choices button:focus-visible{outline:3px solid var(--aqua)}.choices button:disabled{opacity:.65;cursor:default}.foot{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;padding:15px 0 35px}.restart{padding:8px 12px;font-size:14px}.small{color:var(--muted);font-size:13px}.link{display:inline-block;text-decoration:none;margin:8px 0;text-align:center}.code{display:inline-block;background:#0d2730;border:1px dashed #85edba;padding:8px 12px;border-radius:9px;color:var(--green);font:700 17px ui-monospace,monospace}@media(max-width:480px){.bubble{max-width:100%}.head{padding:16px}}
</style></head><body><div class="wrap"><div class="top"><span class="brand">◈ CYBERLAB · CASE 004</span><a href="mission-04.html">Практики місії ↗</a></div><section class="head"><h1>По той бік екрана</h1><p>Навчальний діалог із цифровим аналітиком. Рішення, докази, перевірка гіпотез.</p><div class="small" id="status">Діалог ще не розпочато</div><div class="bar"><div class="fill" id="fill"></div></div></section><main class="chat" id="chat" aria-live="polite"></main><section class="choices" id="choices"></section><footer class="foot"><span class="small">Ваші відповіді залишаються в цьому браузері. Це вебсимуляція, не Telegram-бот.</span><button class="restart" id="reset">↻ Почати спочатку</button></footer></div><script>
'use strict';
const KEY='cyberlab-case004-webbot-v1';
const tasks=[
{intro:'📨 До вас надійшов лист нібито від техпідтримки. Відправник вимагає негайно підтвердити пароль за посиланням. Яка перша дія?',choices:['Відкрити посилання, але не вводити пароль','Перевірити адресу відправника і звернутися до підтримки незалежним каналом','Відповісти на лист із запитанням, чи це справді підтримка'],correct:1,feedback:['Навіть відкриття посилання може створити ризик. Спершу перевірте звернення незалежним каналом.','Так. Адреса й оформлення можуть бути підроблені; незалежний канал важливіший за переконливий вигляд.','Відповідь на підозрілий лист не є незалежною перевіркою: ви продовжуєте спілкування з тим самим джерелом.'],fact:'Ознака маніпуляції: терміновість. Перевірка: незалежний канал зв’язку.'},
{intro:'🧭 Вам дали дозвіл дослідити навчальний вебсайт. Ви знайшли інший сервер тієї ж організації. Чи можна перевіряти його?',choices:['Так, якщо сервер доступний без пароля','Ні. Потрібен окремий дозвіл і визначені межі тестування','Так, якщо нічого не змінювати'],correct:1,feedback:['Відкритий доступ не означає дозволу на перевірку.','Саме так. Обсяг дозволу визначається явно, а не за належністю серверів одній організації.','Навіть пасивні дії можуть виходити за межі погодженого тестування.'],fact:'Етична перевірка: лише погоджені системи, методи й часові межі.'},
{intro:'🗂️ У журналі входів бачите 5 невдалих спроб і 1 успішну. Яке твердження можна захистити доказами?',choices:['Обліковий запис точно зламали','Зафіксовано спроби входу та успішний вхід; потрібні додаткові дані','Власник сам шість разів вводив пароль'],correct:1,feedback:['Журнал показує події, але не доводить особу чи намір.','Правильно: відділяємо спостереження від інтерпретації.','Особу не можна встановити лише за кількістю спроб.'],fact:'Спостереження ≠ висновок. У звіті фіксуйте межі достовірності.'},
{intro:'🔍 Що допоможе перевірити гіпотезу про підозрілий вхід?',choices:['Порівняти час, IP-адресу, пристрій і журнали інших систем','Подивитися лише колір інтерфейсу','Видалити записи й повторити вхід'],correct:0,feedback:['Так: зіставлення незалежних джерел дає сильнішу підставу для висновку.','Колір інтерфейсу не підтверджує походження події.','Видалення записів знищує докази.'],fact:'Метод: кореляція журналів і перевірка часових позначок.'},
{intro:'🧩 Ви бачите два повідомлення: «Доступ із нового пристрою» і «Скидання пароля». Чи доводить їх збіг злам?',choices:['Так, це достатній доказ','Ні. Це індикатори, які треба зіставити з підтвердженими діями власника','Так, якщо повідомлення прийшли вночі'],correct:1,feedback:['Два сигнали ще не встановлюють причину подій.','Саме так. Перевірте, чи ініціював дії власник, і які журнали це підтверджують.','Незвичний час підвищує підозру, але сам по собі нічого не доводить.'],fact:'Індикатор → гіпотеза → перевірка → обережний висновок.'},
{intro:'🚨 Є підозра на несанкціонований доступ. Який план реагування найкращий?',choices:['Негайно стерти всі журнали','Зберегти докази, повідомити відповідального та обмежити ризик за планом','Опублікувати пароль, щоб попередити інших'],correct:1,feedback:['Так ви втратите сліди інциденту.','Правильно: фіксація, ескалація та пропорційні захисні дії.','Публікація пароля збільшує шкоду.'],fact:'Реагування: зафіксувати → повідомити → локалізувати → перевірити.'},
{intro:'⚖️ Оберіть коректний принцип оцінювання ризику.',choices:['Лише за кількістю підозрілих листів','За ймовірністю події та можливими наслідками, з поясненням невизначеності','За найгіршим сценарієм без перевірки'],correct:1,feedback:['Кількість повідомлень не показує можливу шкоду.','Так. Матриця допомагає порівняти ризики, але не замінює аргументації.','Без оцінки ймовірності пріоритети можуть бути хибними.'],fact:'Ризик: імовірність + наслідки; числова оцінка не замінює обґрунтування.'},
{intro:'📝 Останній крок: ви пишете висновок для команди. Який варіант професійний?',choices:['«Нападник точно зламав систему» — без посилань','«У журналі є підозрілі події; причину ще перевіряємо за додатковими джерелами»','«Нічого не сталося, бо даних мало»'],correct:1,feedback:['Категоричний висновок без доказів є помилкою аналітика.','Відмінно. Ви чітко розмежували факт, гіпотезу та наступний крок перевірки.','Брак доказів не означає відсутності інциденту.'],fact:'Фінальна формула: факт → джерело → гіпотеза → обмеження → дія.'}
];
const $=id=>document.getElementById(id);let step=0,done=false,history=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.history)&&Number.isInteger(s.step)&&s.step>=0&&s.step<=tasks.length){step=s.step;done=!!s.done;history=s.history;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({step,done,history}));}catch(e){}}
function bubble(who,text){const el=document.createElement('div');el.className='bubble '+who;const tag=document.createElement('div');tag.className='tag';tag.textContent=who==='bot'?'CYBERLAB · АНАЛІТИК':'ВАШЕ РІШЕННЯ';el.append(tag,document.createTextNode(text));$('chat').append(el)}
function say(who,text){history.push({who,text});bubble(who,text);save()}
function render(){ $('chat').replaceChildren();history.forEach(m=>bubble(m.who,m.text));$('choices').replaceChildren();$('status').textContent=done?'Місію завершено':'Крок '+Math.min(step+1,tasks.length)+' із '+tasks.length;$('fill').style.width=(100*step/tasks.length)+'%';if(done){finishUI();return;}if(!history.length){say('bot','Вітаю у справі CASE 004. Ви — аналітик, який працює лише з навчальними даними. У вас буде вісім рішень. Кожен висновок має спиратися на докази.');}const t=tasks[step];if(!history.some(m=>m.who==='bot'&&m.text===t.intro))say('bot',t.intro);t.choices.forEach((choice,i)=>{const b=document.createElement('button');b.textContent=(i+1)+'. '+choice;b.addEventListener('click',()=>pick(i));$('choices').append(b)});}
function pick(i){const t=tasks[step];$('choices').replaceChildren();say('me',t.choices[i]);say('bot',(i===t.correct?'✅ ':'🔎 ')+t.feedback[i]);if(i!==t.correct){say('bot','Спробуйте ще раз. Підказка: '+t.fact);const b=document.createElement('button');b.textContent='↻ Обрати інший варіант';b.addEventListener('click',()=>render());$('choices').append(b);return;}say('bot','🧠 Нове знання: '+t.fact);step++;if(step===tasks.length){done=true;say('bot','🎉 Вітаємо! Ви завершили діалог місії 04. Збережіть підсумковий PDF-звіт із відповідями веббота. Практики залишаються доступними окремо.');}save();render();}
function botPdfReport(){
 if(!done||step!==tasks.length){alert('Спочатку виконайте всі завдання веббота.');return;}
 const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const answers=history.filter(m=>m.who==='me').map((m,i)=>'<li><b>Відповідь '+(i+1)+':</b> '+esc(m.text)+'</li>').join('');
 const w=window.open('','_blank');if(!w){alert('Дозвольте спливні вікна для друку PDF.');return;}
 w.document.write('<!doctype html><html lang="uk"><head><meta charset="utf-8"><title>CYBERLAB CASE 004 · Звіт</title><style>body{font:14px/1.6 Arial;max-width:760px;margin:32px auto;color:#15283b}li{margin:12px 0}@media print{button{display:none}}</style></head><body><h1>CYBERLAB · CASE 004</h1><h2>Звіт проходження веббота</h2><p>Дата: '+new Date().toLocaleDateString('uk-UA')+'</p><p>Статус: усі '+tasks.length+' завдань виконано.</p><ol>'+answers+'</ol><p>Навчальний звіт, сформований локально у браузері.</p><button onclick="window.print()">Зберегти як PDF / Друк</button></body></html>');w.document.close();
}
function finishUI(){const pbtn=document.createElement('button');pbtn.textContent='📄 Зберегти PDF-звіт веббота';pbtn.addEventListener('click',botPdfReport);$('choices').append(pbtn);const a=document.createElement('a');a.href='mission-04.html';a.className='link';a.textContent='🧪 Перейти до окремих практик місії 04';$('choices').append(a);const p=document.createElement('p');p.className='small';p.textContent='Ця сторінка зберігає лише локальний прогрес. Вона не підтверджує проходження на сервері й не створює захищений одноразовий код.';$('choices').append(p);}
$('reset').addEventListener('click',()=>{if(!confirm('Почати діалог заново?'))return;step=0;done=false;history=[];save();render()});render();
</script></body></html>
