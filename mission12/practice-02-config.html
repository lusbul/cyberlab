<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 02 | CyberLab</title><style>:root{font-family:system-ui,Arial;color:#e9f5ff;background:#071222}*{box-sizing:border-box}body{margin:0;background:linear-gradient(125deg,#071222,#10283e);line-height:1.55}header{position:sticky;top:0;background:#071222ef;border-bottom:1px solid #34526a;z-index:9;padding:12px 4%;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}a{color:#78e8e5}main{max-width:1120px;margin:auto;padding:28px 20px 80px}h1{font-size:clamp(27px,4vw,48px);line-height:1.15}h2{color:#9de9ff}.tag{color:#6be3c0;font-weight:800;font-size:13px;letter-spacing:1px}.card{border:1px solid #345b73;background:#0d2135;border-radius:20px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.btn,button{display:inline-block;background:#48dddd;color:#062338;border:0;border-radius:12px;padding:12px 18px;margin:5px 5px 5px 0;font-size:16px;font-weight:800;cursor:pointer;text-decoration:none}.btn.secondary,button.secondary{background:#25455f;color:#fff}.btn:hover,button:hover{filter:brightness(1.1)}input,select,textarea{font:inherit;background:#091a2b;color:white;border:1px solid #567b91;border-radius:10px;padding:10px;max-width:100%}textarea{width:100%;min-height:90px}label{display:block;margin:9px 0}code,pre{background:#071624;color:#b9f9d8;border-radius:9px;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere}pre{padding:17px}.ok{color:#6ce7ad;font-weight:800}.bad{color:#ffb1a5;font-weight:800}.muted{color:#b1c6d4}.hero{display:grid;grid-template-columns:1fr 190px;gap:20px;align-items:center}.art{font-size:100px;text-align:center;filter:drop-shadow(0 0 25px #35e1e1)}.drop{min-height:62px;border:2px dashed #62869c;border-radius:12px;padding:12px;margin:7px 0}.tile{display:inline-block;background:#284b66;border:1px solid #6694ad;padding:11px;border-radius:10px;margin:5px;cursor:grab;touch-action:manipulation}.selected{outline:3px solid #48dddd}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #31536c;padding:10px;text-align:left}progress{width:100%;height:15px}small{color:#b4cad6}@media(max-width:650px){.hero{grid-template-columns:1fr}.art{font-size:65px}main{padding:18px 12px}}@media print{header,.btn,button{display:none!important}body{background:white;color:black}.card{background:white;color:black;border:1px solid #aaa}}</style></head><body><header><b>🛡️ CYBERLAB // CASE 012</b><nav><a href="mission-12.html">Головна</a> · <a href="cyberlab-bot12.html">🤖 Бот</a></nav></header><main><div class="tag">ПРАКТИКА 02 / КОНФІГУРАТОР</div><h1>🛠️ Конструктор захищеної сесії</h1><p>Перемикайте налаштування та перевіряйте, які ризики залишаються.</p><section class="card"><label><input type="checkbox" id="secure"> Secure — тільки захищений канал HTTPS</label><label><input type="checkbox" id="httpOnly"> HttpOnly — заборонити читання cookie через JavaScript</label><label>SameSite <select id="same"><option>None</option><option>Lax</option><option>Strict</option></select></label><label><input type="checkbox" id="revoke"> Сервер відкликає сесію після logout</label><button onclick="test()">▶ Запустити три сценарії</button><div id="out"></div></section><section class="card"><h2>Питання аналітика</h2><label>Чи достатньо Secure + HttpOnly + SameSite без серверного відкликання?<select id="answer"><option value="">Оберіть</option><option value="no">Ні, старий ідентифікатор може залишитися чинним</option><option value="yes">Так, цього завжди достатньо</option></select></label><button onclick="document.getElementById('msg').textContent=answer.value==='no'?'✓ Правильно. Захист cookie і відкликання сесії вирішують різні задачі.':'Спробуйте ще раз: перевірте, що сервер робить зі старою сесією.'">Перевірити</button><p id="msg"></p></section><a class="btn" href="practice-03-logout.html">До практики 03 →</a></main><script>function test(){let s=secure.checked,h=httpOnly.checked,m=same.value,r=revoke.checked;out.innerHTML='<h3>Результат моделювання</h3><p>'+(s?'🟢 HTTPS: cookie з Secure не надсилається звичайним HTTP (за винятком особливостей localhost).':'🔴 HTTP: немає захисту Secure; можливе передавання cookie незахищеним каналом.')+'</p><p>'+(h?'🟢 document.cookie: доступ до цієї cookie заборонений.':'🔴 document.cookie: JavaScript може прочитати cookie за відсутності інших обмежень.')+'</p><p>'+(m==='None'?'🟠 SameSite=None: міжсайтові запити можливі за відповідних умов; у сучасних браузерах потрібен Secure.':m==='Lax'?'🟢 SameSite=Lax: частина міжсайтових запитів обмежена.':'🟢 SameSite=Strict: суворіше обмеження міжсайтового надсилання.')+'</p><p>'+(r?'🟢 Повторний запит зі старим ID після logout → 401.':'🔴 Повторний запит зі старим ID після logout → 200: сервер не відкликав сесію.')+'</p>';}</script></body></html>
