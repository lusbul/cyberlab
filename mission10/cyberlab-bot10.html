<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CyberLab · Веббот 10</title><style>body{background:#07101f;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;line-height:1.6}main{max-width:1080px;margin:auto;padding:25px 20px 65px}a{color:#4ce3ff}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}h2{color:#4ce3ff}.panel,.card{background:#101f35;border:1px solid #284768;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn,button{display:inline-block;background:#123c60;border:1px solid #35c8ee;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;margin:5px 4px 5px 0}button:hover,.btn:hover{background:#17658b}input,select,textarea{background:#071524;border:1px solid #4d7595;border-radius:8px;color:white;padding:10px;font:inherit;max-width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061321;padding:14px;border-radius:12px;border:1px solid #254661}.tag{color:#4ce3ff;letter-spacing:.12em;font-weight:700}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:2rem;align-items:center;padding:36px 0}.hero img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:1px solid #2c5372}.muted{color:#abc3d9}.ok{color:#74f0b2}.bad{color:#ff8494}.tile{border:1px solid #487aa0;background:#17354f;border-radius:10px;padding:10px;cursor:grab;margin:6px 0}.drop{min-height:45px;border:2px dashed #487aa0;border-radius:10px;padding:10px;margin:6px 0}.drop.over{background:#234a66}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #34506a;text-align:left}tr[data-i]{cursor:pointer}tr[data-i]:hover,tr.selected{background:#254869}.scroll{overflow:auto;max-height:390px}code{color:#8de9ff}@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{max-width:360px}}</style></head><body><main><nav><a href="mission-10.html">← Місія 10</a> · <a href="../">CyberLab</a></nav><header><div class="tag">CYBERLAB // WEBBOT 010</div><h1>🤖 Розслідування 847 пакетів</h1><p>15 послідовних завдань. Відповідайте за даними навчального дампу. FLAG і звіт відкриються лише після останнього кроку.</p></header><section class="panel"><p id="progress"></p><h2 id="question"></h2><div id="choices"></div><p id="feedback" aria-live="polite"></p></section><section class="panel" id="done" hidden><h2 class="ok">MISSION 10 COMPLETE</h2><p>🚩 <b id="flag"></b></p><button onclick="window.print()">🖨 Зберегти PDF-звіт</button><p class="muted">У вікні друку оберіть «Зберегти як PDF».</p><div id="report"></div></section></main><script>const qs=[["Пакет показує номер, час, джерело та…", ["колір браузера", "призначення й протокол", "пароль користувача"], 1], ["Який display filter показує DNS?", ["dns", "html", "route"], 0], ["Чи доводить один DNS-запит атаку?", ["так", "ні"], 1], ["Який домен з’явився перед інцидентом?", ["training-update.example", "weather.example", "classroom.example"], 0], ["Яку IP повернув DNS для training-update.example?", ["203.0.113.88", "203.0.113.42", "192.168.1.14"], 0], ["Який фільтр покаже трафік цієї IP?", ["ip.addr == 203.0.113.88", "http.host == dns", "ip.addr == 127.0.0.1"], 0], ["Скільки пакетів залишилося у нашому навчальному дампі після IP-фільтра?", ["37", "847", "23"], 0], ["Який протокол відповідає за встановлення з’єднання в цьому фрагменті?", ["TCP", "DNS", "HTML"], 0], ["Який HTTP-шлях запитував комп’ютер для ZIP?", ["/files/update.zip", "/secret/password", "/admin"], 0], ["Чи доводить GET /files/update.zip, що ZIP містив вірус?", ["так", "ні"], 1], ["Чому в TLS Application Data не видно HTTP-запиту?", ["його захищає TLS", "його видалив DNS", "TLS не передає даних"], 0], ["Що дозволяє переглянути Follow TCP Stream?", ["розмову одного TCP-потоку", "усі паролі HTTPS", "географію користувача"], 0], ["Який текст знайдено у відповіді /training/flag.txt?", ["PACKETS_TELL_STORIES", "HTTPS_IS_BROKEN", "NO_PACKETS"], 0], ["Яке значення code містить POST /report?", ["BLUEFOX", "CAT2026", "UPDATE"], 0], ["Чи доводить дамп, що користувач свідомо зробив запит?", ["так", "ні, недостатньо даних"], 1]];let step=0,log=[];function show(){document.getElementById('progress').textContent=`Завдання ${step+1} із ${qs.length}`;document.getElementById('question').textContent=qs[step][0];document.getElementById('feedback').textContent='';let c=document.getElementById('choices');c.innerHTML='';qs[step][1].forEach((s,i)=>{let b=document.createElement('button');b.textContent=s;b.onclick=()=>answer(i);c.appendChild(b)})}function answer(i){if(i!==qs[step][2]){document.getElementById('feedback').textContent='Спробуйте ще раз. Перевірте артефакт або відповідну практику.';return}log.push(`${step+1}. ${qs[step][0]} — ${qs[step][1][i]}`);step++;if(step<qs.length)show();else{document.querySelector('.panel').hidden=true;let d=document.getElementById('done');d.hidden=false;document.getElementById('flag').textContent='FLAG{PACKETS_TELL_STORIES_BLUEFOX}';document.getElementById('report').innerHTML='<h3>Звіт аналітика CyberLab · CASE 010</h3><p>Дата: '+new Date().toLocaleDateString('uk-UA')+'</p><p>Навчальний дамп: incident_010.pcapng · 847 пакетів</p><p>Висновок: спостерігався DNS-запит до training-update.example, з’єднання з 203.0.113.88, HTTP-запити GET і POST. Вміст ZIP та ініціатор дій не встановлені.</p><ol>'+log.map(x=>'<li>'+x+'</li>').join('')+'</ol>';}}show();</script></body></html>
