<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 05 — CyberLab</title><style>:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#0a3450,#07101f 65%);color:#eaf7ff;line-height:1.55}main{max-width:1060px;margin:auto;padding:25px 20px 70px}nav{display:flex;justify-content:space-between;border-bottom:1px solid #2b526c;padding:15px 0}a{color:#43e5ff}h1{font-size:clamp(30px,5vw,54px);line-height:1.1}h2{color:#6de9ff}.hero{width:100%;max-height:460px;object-fit:cover;border-radius:18px;border:1px solid #245b79}.panel{background:#0d2034;border:1px solid #285573;border-radius:18px;padding:22px;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.btn,button{background:#075477;color:#fff;border:1px solid #25caff;border-radius:11px;padding:12px 17px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;margin:5px 5px 5px 0}.btn:hover,button:hover{background:#087ca7}button:disabled{opacity:.5;cursor:not-allowed}input,select{background:#08192b;color:white;border:1px solid #4e8ca7;border-radius:8px;padding:12px;font:inherit;max-width:100%}pre,.record{white-space:pre-wrap;overflow-wrap:anywhere;background:#071526;padding:14px;border-radius:9px;color:#a5e4fc}small,.muted{color:#a9c0d2}.ok{color:#6df1a9}.bad{color:#ffac9f}.bubble{background:#142d45;border-radius:15px;padding:15px;margin:12px 0}.you{background:#184d62;margin-left:15%}.hidden{display:none}iframe{max-width:100%;border:0;border-radius:12px}@media print{nav,.controls,button,.btn,iframe{display:none!important}body{background:white;color:black}.panel,.bubble{background:white;color:black;border:1px solid #888}.muted{color:#333}}</style></head><body><main><nav><strong>⌘ CYBERLAB // CASE 005</strong><a href="../index.html">Усі місії ↗</a></nav><p><a href="mission-05.html">← Повернутися до місії</a></p><h1>🧬 Практика 01 · Цифровий відбиток</h1><p>Введіть <code>cat</code>, потім <code>Cat</code> і <code>cat!</code>. Чи однакові хеші?</p><section class="panel"><input id="v" value="cat" aria-label="Навчальний текст"><button id="go">Порахувати SHA-256</button><p id="result" class="record">Очікую введення…</p><button id="cat">cat</button><button id="Cat">Cat</button><button id="catbang">cat!</button></section><p class="muted">Обчислення відбувається у вашому браузері через Web Crypto. Не вводьте справжні паролі.</p><script>async function calc(){let b=new TextEncoder().encode(document.querySelector('#v').value),h=await crypto.subtle.digest('SHA-256',b);document.querySelector('#result').textContent=[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}document.querySelector('#go').onclick=calc;for(let [id,s] of [['cat','cat'],['Cat','Cat'],['catbang','cat!']])document.getElementById(id).onclick=()=>{document.querySelector('#v').value=s;calc()};calc()</script></main></body></html>
