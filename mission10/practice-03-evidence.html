<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 03 · Докази</title><style>body{background:#07101f;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;line-height:1.6}main{max-width:1080px;margin:auto;padding:25px 20px 65px}a{color:#4ce3ff}h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.1}h2{color:#4ce3ff}.panel,.card{background:#101f35;border:1px solid #284768;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn,button{display:inline-block;background:#123c60;border:1px solid #35c8ee;color:white;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;margin:5px 4px 5px 0}button:hover,.btn:hover{background:#17658b}input,select,textarea{background:#071524;border:1px solid #4d7595;border-radius:8px;color:white;padding:10px;font:inherit;max-width:95%}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061321;padding:14px;border-radius:12px;border:1px solid #254661}.tag{color:#4ce3ff;letter-spacing:.12em;font-weight:700}.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(230px,1fr);gap:2rem;align-items:center;padding:36px 0}.hero img{width:100%;max-height:260px;object-fit:cover;border-radius:18px;border:1px solid #2c5372}.muted{color:#abc3d9}.ok{color:#74f0b2}.bad{color:#ff8494}.tile{border:1px solid #487aa0;background:#17354f;border-radius:10px;padding:10px;cursor:grab;margin:6px 0}.drop{min-height:45px;border:2px dashed #487aa0;border-radius:10px;padding:10px;margin:6px 0}.drop.over{background:#234a66}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:7px;border-bottom:1px solid #34506a;text-align:left}tr[data-i]{cursor:pointer}tr[data-i]:hover,tr.selected{background:#254869}.scroll{overflow:auto;max-height:390px}code{color:#8de9ff}@media(max-width:700px){.hero{grid-template-columns:1fr}.hero img{max-width:360px}}</style></head><body><main><nav><a href="mission-10.html">← Місія 10</a> · <a href="../">CyberLab</a></nav><h1>🔎 Доказ чи припущення?</h1><p>Перевірте, які висновки справді підтверджені мережевим дампом.</p><section class="panel" id="qs"></section><button onclick="check()">Перевірити відповіді</button><p id="out" aria-live="polite"></p></main><script>const qs=[["У журналі є GET /files/update.zip. Що точно відомо?", ["Комп’ютер завантажив вірус", "Сформовано HTTP-запит до цього шляху", "Користувач свідомо встановив програму"], 1, "Вміст ZIP і дії людини з цього пакета не доведені."], ["У TLS-пакеті написано Application Data. Чому не видно GET /secret?", ["Вміст захищено TLS", "HTTP не працює з TLS", "Пакет порожній"], 0, "Без ключів сеансу вміст захищеного HTTP зазвичай не прочитати."], ["Комп’ютер звертався до training-update.example, а користувач заперечує. Хто бреше?", ["Користувач", "Wireshark", "Недостатньо даних"], 2, "Запит могла ініціювати вкладка, розширення або інша програма."], ["Який фільтр покаже пакети до/від 203.0.113.88?", ["dns", "ip.addr == 203.0.113.88", "tcp.stream eq 8"], 1, "Фільтр ip.addr охоплює джерело або призначення."], ["Що робить Follow TCP Stream?", ["Відновлює розмову з пакетів потоку", "Змінює IP-адресу", "Розшифровує будь-який TLS"], 0, "Він збирає послідовність даних одного TCP-потоку."]];document.getElementById('qs').innerHTML=qs.map((q,i)=>`<div class="card"><b>${i+1}. ${q[0]}</b>${q[1].map((v,j)=>`<label style="display:block;padding:7px"><input type="radio" name="q${i}" value="${j}"> ${v}</label>`).join('')}</div>`).join('');function check(){let n=0,notes=[];qs.forEach((q,i)=>{let x=document.querySelector(`input[name=q${i}]:checked`);if(x&&+x.value===q[2])n++;else notes.push(`${i+1}: ${q[3]}`)});document.getElementById('out').textContent=`Правильно: ${n} із ${qs.length}. `+(notes.length?notes.join(' '):'✓ Усі висновки обґрунтовані!')}</script></body></html>
