<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 05 · Реагувати чи спостерігати? — CyberLab 015</title><style>*{box-sizing:border-box}body{margin:0;background:#071321;color:#e9f5ff;font:16px/1.65 system-ui,Arial}header{background:#081827;border-bottom:1px solid #25445b;padding:14px max(4vw,18px);position:sticky;top:0;z-index:3}header a{color:#64e3e7;text-decoration:none}main{max-width:1120px;margin:auto;padding:25px 20px 90px}h1{font-size:clamp(26px,4vw,43px);line-height:1.2}h2{color:#73e4ed;margin-top:32px}h3{color:#a8e7ee}.eyebrow{color:#73e4ed;font-weight:800;letter-spacing:2px}.card{background:#102337;border:1px solid #34556d;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.btn,button{display:inline-block;border:0;border-radius:12px;padding:12px 18px;background:#4bdee2;color:#082332;font-weight:800;text-decoration:none;cursor:pointer;margin:5px 5px 5px 0;font:inherit;font-weight:750}.btn.secondary,button.secondary{background:#25455e;color:white}button:hover,.btn:hover{filter:brightness(1.1)}input,select,textarea{background:#071827;color:white;border:1px solid #54728b;border-radius:9px;padding:11px;font:inherit;max-width:100%}input,textarea{width:100%}textarea{min-height:130px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#061421;border:1px solid #29445c;padding:16px;border-radius:12px;font-size:13px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:10px;border-bottom:1px solid #2a4960;text-align:left}th{color:#8de5e9}.good{color:#70e3a6;font-weight:750}.bad{color:#ff9e94;font-weight:750}.muted{color:#a8bdcc}.tile{border:1px solid #6b91a5;border-radius:10px;padding:11px;background:#21415a;cursor:grab;margin:7px 0;touch-action:manipulation}.tile.selected{outline:3px solid #49dce2}.zone{min-height:92px;border:1px dashed #5c8099;border-radius:12px;padding:12px;margin:8px 0}.pill{border-radius:20px;padding:4px 10px;background:#20465a;color:#8ae3e9;font-size:12px}.hero{display:flex;align-items:center;gap:25px}.hero>div:first-child{flex:1}.art{font-size:100px;line-height:1}@media(max-width:600px){.hero{display:block}.art{font-size:55px}header{position:static}}.progress{height:8px;background:#284153;border-radius:8px;overflow:hidden}.progress>div{height:100%;background:#50e0df}a{color:#77e4ec}details{margin:10px 0;padding:10px;background:#122b40;border-radius:9px}summary{cursor:pointer}label{display:block;margin-top:12px}</style></head><body><header><a href="mission-15.html">◈ CYBERLAB // CASE 015</a> <span class="muted"> · <a href="mission-15.html">← Назад</a></span></header><main><div class="eyebrow">CYBERLAB // SOC INVESTIGATION</div><h1>Практика 05 · Реагувати чи спостерігати?</h1><p class="muted">Рішення SOC-аналітика · наслідки та пріоритети</p><div class="card"><h2>Оберіть план реагування</h2><p>Позначте три обґрунтовані дії. Натисніть «Перевірити» — побачите пояснення наслідків. Можна повторити.</p><div id="choices"></div><button onclick="verify()">Перевірити рішення</button><button class="secondary" onclick="reset()">↻ Скинути</button><div id="feedback"></div></div><a class="btn" href="ctf-15.html">До CTF 15 →</a></main><script>function $(id){return document.getElementById(id)}function msg(s,ok=true,id='feedback'){$(id).innerHTML='<p class="'+(ok?'good':'bad')+'">'+s+'</p>'}function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}if(b.every((x,i)=>x===a[i])&&b.length>1)[b[0],b[1]]=[b[1],b[0]];return b}function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function savePdf(title,body){let w=window.open('','_blank');if(!w){alert('Дозвольте спливні вікна для PDF або скористайтеся друком сторінки.');return}w.document.write('<!doctype html><html lang="uk"><meta charset="utf-8"><title>'+safe(title)+'</title><style>body{font:15px/1.6 Arial;max-width:800px;margin:35px}pre{white-space:pre-wrap}h1{color:#123}</style><h1>'+safe(title)+'</h1>'+body+'<script>window.onload=()=>window.print()<\/script></html>');w.document.close()}
const choices=[["Збереження доказів", "Зафіксувати журнали та час отримання, зберегти копії без змін", "good"], ["Перевірка", "Зіставити сесію, запит експорту та дозволені роботи", "good"], ["Узгоджене стримування", "Повідомити відповідального і за процедурою обмежити підозрілу сесію", "good"], ["Необдумана дія", "Негайно вимкнути всю мережу без узгодження", "bad"], ["Ігнорування", "Видалити логи, бо інцидент ще не доведено", "bad"]];function reset(){$('choices').innerHTML=choices.map((c,i)=>`<label class="card"><input type="checkbox" style="width:auto" value="${i}"> <b>${c[0]}</b><p>${c[1]}</p></label>`).join('');$('feedback').innerHTML=''}function verify(){let a=[...document.querySelectorAll('#choices input:checked')].map(e=>+e.value);let ok=a.length===3&&a.every(i=>choices[i][2]==='good');msg(ok?'Правильно: спочатку докази та перевірка, потім узгоджені захисні дії.':'Обирайте лише пропорційні, документовані дії. Не знищуйте докази й не вимикайте всю мережу без потреби.',ok)}reset();</script></body></html>
