<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Практика 03 · DNS-детектив</title><style>body{background:#07101f;color:#edf6ff;font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;line-height:1.6}main{max-width:1080px;margin:auto;padding:25px 20px 65px}a{color:#4ce3ff}h1{font-size:clamp(2rem,5vw,3.3rem);line-height:1.1}h1,h2{color:#eff9ff}h2{color:#4ce3ff}.panel,.card{background:#101f35;border:1px solid #284768;border-radius:18px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.btn,button{display:inline-block;background:#123c60;border:1px solid #35c8ee;color:white;padding:11px 16px;border-radius:10px;cursor:pointer;font:inherit;text-decoration:none;margin:5px 5px 5px 0}button:hover,.btn:hover{background:#17658b}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{background:#071524;border:1px solid #4d7595;border-radius:8px;color:white;padding:10px;font:inherit;max-width:100%}.muted,small{color:#a8bdd4}.ok{color:#6cf0a8}.bad{color:#ff8796}.pill{display:inline-block;border:1px solid #3d718b;padding:5px 10px;border-radius:20px;margin:3px}.tile{background:#142d47;border:1px solid #487aa0;border-radius:10px;padding:12px;cursor:grab;touch-action:none}.drop{min-height:65px;border:2px dashed #45789c;border-radius:12px;padding:12px}.drop.over{background:#214c68}pre{white-space:pre-wrap;word-break:break-word;background:#061321;padding:16px;border-radius:12px;border:1px solid #254661}nav{padding:12px 0}.tag{color:#4ce3ff;letter-spacing:.15em;font-weight:700}</style></head><body><main><nav><a href="mission-09.html">← Місія 09</a> · <a href="../">CyberLab</a></nav><div class="tag">ПРАКТИКА 03 / DNS-ДЕТЕКТИВ</div><h1>🕵️ Захищене з’єднання з шахраєм?</h1><div class="panel"><div id="scene"></div><div id="options"></div><p id="note" aria-live="polite"></p><button id="again" hidden>Пройти знову</button></div></main><script>const cases=[{q:'DNS повернув 203.0.113.77, хоча офіційна IP — 203.0.113.42. Що зробити?',a:['Ігнорувати — сайт же відкрився','Позначити розбіжність і перевірити джерело'],good:1,why:'Правильно: отримана IP не відповідає очікуваній.'},{q:'Браузер показує https://portal-cyberlab.example. Є замок. Чи гарантує це, що сайт належить CyberLab?',a:['Так, HTTPS доводить доброчесність сайту','Ні, TLS захищає з’єднання, але треба перевіряти домен'],good:1,why:'Правильно: захищене з’єднання може вести й до шахрайського домену.'},{q:'У навчальному дампі видно HTTPS. Чи можна просто прочитати пароль з HTTP-запиту?',a:['Так, вміст завжди відкритий','Ні, вміст HTTP захищений TLS'],good:1,why:'Правильно: вміст HTTP усередині TLS зашифрований.'},{q:'Що варто зробити до введення пароля?',a:['Звірити домен з офіційним і не довіряти лише дизайну','Орієнтуватися на логотип і печатку'],good:0,why:'Вірно. Зовнішня схожість — не доказ справжності.'}];let n=0;function draw(){let c=cases[n];document.getElementById('scene').innerHTML='<h2>Крок '+(n+1)+' / '+cases.length+'</h2><p>'+c.q+'</p>';let o=document.getElementById('options');o.innerHTML='';c.a.forEach((a,i)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{let ok=i===c.good;document.getElementById('note').textContent=ok?'✅ '+c.why:'⚠️ Подумайте ще раз.';if(ok){[...o.children].forEach(x=>x.disabled=true);let next=document.createElement('button');next.textContent=n===cases.length-1?'Показати висновок':'Наступний крок →';next.onclick=()=>{n++;document.getElementById('note').textContent='';if(n===cases.length){document.getElementById('scene').innerHTML='<h2 class="ok">Розслідування завершено!</h2><p>Підозра виникла на етапі DNS. HTTPS сам по собі не робить підроблений сайт справжнім.</p>';o.innerHTML='';document.getElementById('again').hidden=false}else draw()};o.append(next)}};o.append(b)})}document.getElementById('again').onclick=()=>{n=0;document.getElementById('again').hidden=true;draw()};draw();</script></body></html>
